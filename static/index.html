<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namma Jothidam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="9" fill="currentColor" />
        <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="24" y1="2" x2="24" y2="10" />
          <line x1="24" y1="38" x2="24" y2="46" />
          <line x1="2" y1="24" x2="10" y2="24" />
          <line x1="38" y1="24" x2="46" y2="24" />
          <line x1="8.2" y1="8.2" x2="13.8" y2="13.8" />
          <line x1="34.2" y1="34.2" x2="39.8" y2="39.8" />
          <line x1="8.2" y1="39.8" x2="13.8" y2="34.2" />
          <line x1="34.2" y1="13.8" x2="39.8" y2="8.2" />
        </g>
      </svg>
      <div class="brand-text">
        <h1 id="pageTitle">Namma Jothidam</h1>
        <p id="pageTagline" class="tagline">your personal jathakam, cast in a moment</p>
      </div>
    </div>
    <select id="langToggle">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </header>
  <div class="kolam-divider" aria-hidden="true"></div>

  <main>
    <section id="formSection" class="card">
      <h2 id="lblFormTitle">New Chart</h2>
      <form id="birthForm">
        <label><span id="lblName">Name</span><input type="text" id="name" required /></label>
        <label><span id="lblGender">Gender</span>
          <select id="gender">
            <option value="Male" id="optMale">Male</option>
            <option value="Female" id="optFemale">Female</option>
            <option value="Other" id="optOther">Other</option>
          </select>
        </label>
        <label><span id="lblDob">Date of Birth</span><input type="date" id="dob" required /></label>
        <label><span id="lblTob">Time of Birth</span>
          <div class="tob-group">
            <select id="tobHour" aria-label="Hour">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option><option value="11">11</option><option value="12" selected>12</option>
            </select>
            <span class="tob-colon">:</span>
            <select id="tobMinute" aria-label="Minute"></select>
            <select id="tobAmPm" aria-label="AM or PM">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </label>
        <label class="pob-field">
          <span id="lblPob">Place of Birth</span>
          <input type="text" id="pob" autocomplete="off" required />
          <ul id="pobResults" class="pob-results hidden"></ul>
        </label>
        <button type="submit" id="btnCalculate">Calculate Chart</button>
      </form>
    </section>

    <section id="savedSection" class="card">
      <h2 id="lblSavedCharts">Saved Charts</h2>
      <ul id="savedList"></ul>
    </section>

    <section id="resultSection" class="card hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="chartTab" id="lblChartTab">Chart</button>
        <button class="tab-btn" data-tab="dasaTab" id="lblDasaTab">Dasa</button>
        <button class="tab-btn" data-tab="yogaTab" id="lblYogaTab">Yogas</button>
        <button class="tab-btn" data-tab="taraTab" id="lblTaraTab">Tara Balam</button>
      </div>

      <div id="chartTab" class="tab-panel active">
        <select id="vargaSelect"></select>
        <div id="chartGrid" class="south-indian-grid"></div>
      </div>

      <div id="dasaTab" class="tab-panel">
        <table id="dasaTable">
          <thead><tr><th>Lord</th><th>Start</th><th>End</th></tr></thead>
          <tbody id="dasaBody"></tbody>
        </table>
      </div>

      <div id="yogaTab" class="tab-panel">
        <ul id="yogaList"></ul>
      </div>

      <div id="taraTab" class="tab-panel">
        <table id="taraTable">
          <thead><tr><th>#</th><th>Nakshatra</th><th>Category</th><th>Quality</th></tr></thead>
          <tbody id="taraBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">Namma Jothidam</footer>

  <script src="labels.js"></script>
  <script src="chart.js"></script>
</body>
</html>
